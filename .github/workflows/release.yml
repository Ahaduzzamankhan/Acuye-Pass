name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0. Creates the tag if it does not exist."
        required: true
        type: string

permissions:
  contents: write

# Shares a queue with the Android release so both workflows can publish to the
# same GitHub release without racing to create it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$REF_NAME"
          fi
          version="$(printf '%s' "$version" | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "no release version was provided" >&2
            exit 1
          fi
          case "$version" in
            v*|V*) ;;
            *) version="v$version" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify updater public key matches config
        shell: bash
        env:
          ACUYE_UPDATER_PUBKEY: ${{ secrets.ACUYE_UPDATER_PUBKEY }}
        run: |
          configured=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey" | tr -d '[:space:]')
          provided=$(printf '%s' "$ACUYE_UPDATER_PUBKEY" | tr -d '[:space:]')
          if [ -z "$provided" ]; then
            echo "ACUYE_UPDATER_PUBKEY is empty; signed updates would be unverifiable" >&2
            exit 1
          fi
          if [ "$configured" != "$provided" ]; then
            echo "plugins.updater.pubkey in tauri.conf.json does not match ACUYE_UPDATER_PUBKEY" >&2
            exit 1
          fi

      - name: Validate and apply release version
        shell: bash
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --workspace

      - name: Build installers and updater signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ACUYE_UPDATER_PUBKEY: ${{ secrets.ACUYE_UPDATER_PUBKEY }}
        run: pnpm desktop:build

      - name: Verify updater artifacts
        shell: bash
        run: |
          shopt -s globstar nullglob
          installers=(target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "no installers were produced" >&2
            exit 1
          fi
          for installer in "${installers[@]}"; do
            if [ ! -f "${installer}.sig" ]; then
              echo "missing signature for ${installer}" >&2
              exit 1
            fi
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
