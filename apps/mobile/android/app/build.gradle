apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

// Tagged release builds pass -PacuyeVersionName/-PacuyeVersionCode.
def acuyeVersionName = (findProperty("acuyeVersionName") ?: "0.1.4").toString()
def acuyeVersionCode = (findProperty("acuyeVersionCode") ?: "1").toString().toInteger()

android {
    namespace "com.fluxenite.acuyepass.mobile"
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.fluxenite.acuyepass.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode acuyeVersionCode
        versionName acuyeVersionName
        // The Rust core is shipped as two ABIs, matching the desktop release
        // targets: 32-bit ARM (Android 7 devices) and ARM64.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        if (System.getenv("ACUYE_KEYSTORE_PATH")) {
            release {
                storeFile file(System.getenv("ACUYE_KEYSTORE_PATH"))
                storePassword System.getenv("ACUYE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ACUYE_KEY_ALIAS")
                keyPassword System.getenv("ACUYE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (System.getenv("ACUYE_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.appcompat:appcompat:1.7.0")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
}
