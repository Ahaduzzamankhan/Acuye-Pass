[package]
name = "acuye-pass"
version = "0.1.2"
description = "Acuye Pass — privacy-focused password manager by Fluxenite"
edition = "2021"
rust-version = "1.84"
license = "MIT"
repository = "https://github.com/Ahaduzzamankhan/Acuye-Pass"
authors = ["Fluxenite"]
default-run = "acuye-pass"

[lib]
name = "acuye_pass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
acuye-core = { workspace = true }
acuye-crypto = { workspace = true }
acuye-vault = { workspace = true }
acuye-storage = { workspace = true }
acuye-auth = { workspace = true }
acuye-generator = { workspace = true }
acuye-import = { workspace = true }
acuye-export = { workspace = true }
acuye-platform = { workspace = true }
acuye-updater = { workspace = true }
acuye-totp = { workspace = true }
acuye-breach = { workspace = true }
acuye-lan = { workspace = true }
zeroize = { workspace = true }
